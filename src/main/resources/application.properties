spring.application.name=shop
spring.profiles.active=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${DB_PORT:5433}/shopdb}
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.data.web.pageable.max-page-size=100

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d

payments.simulation.enabled=${PAYMENT_SIMULATION_ENABLED:true}
shop.currency=${SHOP_CURRENCY:USD}
