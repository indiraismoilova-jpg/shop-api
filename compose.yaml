services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: ${DB_USERNAME:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/Set-LocalEnvironment.ps1 first}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
